<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LibAR — 서가 스캔 (중간 제출 데모)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Geist:wght@500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<style>
  @keyframes pulse-glow { 0%{box-shadow:0 0 0 0 rgba(75,226,119,.4)} 70%{box-shadow:0 0 0 10px rgba(75,226,119,0)} 100%{box-shadow:0 0 0 0 rgba(75,226,119,0)} }
  @keyframes scanline { 0%{transform:translateY(-100%)} 100%{transform:translateY(100%)} }
  .scan-line { background:linear-gradient(to bottom,transparent,rgba(75,226,119,.5),transparent); animation:scanline 4s linear infinite; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .view { display:none; } .view.active { display:block; }
</style>
<script id="tailwind-config">
tailwind.config = { darkMode:"class", theme:{ extend:{
  colors:{ "surface-container":"#171f33","surface-container-high":"#222a3d","surface-container-low":"#131b2e",
    "primary":"#4be277","primary-container":"#22c55e","on-primary":"#003915","on-primary-container":"#004b1e",
    "background":"#0b1326","on-surface":"#dae2fd","on-surface-variant":"#bccbb9","surface-variant":"#2d3449",
    "outline":"#869585","outline-variant":"#3d4a3d","error":"#ffb4ab","error-container":"#93000a","on-error":"#690005",
    "info":"#7cb7ff" },
  fontFamily:{ "headline":["Hanken Grotesk"], "mono-data":["Geist"] }
}}};
</script>
</head>
<body class="bg-background text-on-surface font-headline min-h-screen">

<!-- ═══════ 홈 화면 ═══════ -->
<div id="view-home" class="view active max-w-md mx-auto px-4 py-6 space-y-6">
  <header class="flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary text-3xl">view_in_ar</span>
      <h1 class="text-2xl font-bold">LibAR</h1>
    </div>
    <button class="bg-surface-container border border-outline-variant rounded-lg px-3 py-1.5 text-sm flex items-center gap-1">
      영등포구립 대림도서관 <span class="material-symbols-outlined text-base">expand_more</span>
    </button>
  </header>

  <div class="grid grid-cols-2 gap-3">
    <button onclick="show('scan')" class="bg-primary-container text-on-primary-container rounded-xl p-5 text-left space-y-2 shadow-lg" style="animation:pulse-glow 2s infinite">
      <span class="material-symbols-outlined text-4xl">photo_camera</span>
      <div class="font-bold text-lg">스캔 시작</div>
      <div class="text-xs opacity-80">서가를 비추면 오배열을 찾아냅니다</div>
    </button>
    <button class="bg-surface-container border border-outline-variant rounded-xl p-5 text-left space-y-2">
      <span class="material-symbols-outlined text-4xl text-primary">search</span>
      <div class="font-bold text-lg">도서 찾기</div>
      <div class="text-xs text-on-surface-variant">청구기호·제목으로 위치 안내</div>
    </button>
  </div>

  <section class="space-y-2">
    <h2 class="text-xs font-semibold tracking-widest text-on-surface-variant">구간 선택</h2>
    <div class="flex gap-2 overflow-x-auto pb-1">
      <span class="shrink-0 px-3 py-1.5 rounded-md text-sm bg-surface-container border border-outline-variant">600번대</span>
      <span class="shrink-0 px-3 py-1.5 rounded-md text-sm bg-surface-container border border-outline-variant">700번대</span>
      <span class="shrink-0 px-3 py-1.5 rounded-md text-sm bg-surface-container border border-outline-variant">800번대</span>
      <span class="shrink-0 px-3 py-1.5 rounded-md text-sm bg-primary/20 text-primary border border-primary/50 font-bold">862-912</span>
      <span class="shrink-0 px-3 py-1.5 rounded-md text-sm text-on-surface-variant border border-dashed border-outline-variant">+ 장서목록</span>
    </div>
  </section>

  <section class="space-y-2">
    <h2 class="text-xs font-semibold tracking-widest text-on-surface-variant">최근 스캔</h2>
    <div class="bg-surface-container border border-outline-variant rounded-xl divide-y divide-outline-variant">
      <div class="p-4 flex justify-between items-center">
        <div><div class="font-bold">862-912 구간</div><div class="text-xs text-on-surface-variant">오늘 · 걷기 스캔 3회</div></div>
        <div class="text-right"><div class="text-primary font-bold">판독률 95%</div><div class="text-xs text-error">오배열 의심 2건</div></div>
      </div>
      <div class="p-4 flex justify-between items-center">
        <div><div class="font-bold">700번대</div><div class="text-xs text-on-surface-variant">어제 · 사진 스캔</div></div>
        <div class="text-right"><div class="text-primary font-bold">26권 매칭</div><div class="text-xs text-on-surface-variant">17° 기울기 보정</div></div>
      </div>
    </div>
  </section>

  <footer class="text-center text-xs text-on-surface-variant space-y-1 pt-2">
    <div>🔒 모든 처리는 이 기기 안에서 · 서버 전송 없음</div>
    <div class="font-mono-data">인식 v4 · 검출 v3 · <span id="home-backend">-</span></div>
  </footer>
</div>

<!-- ═══════ 스캔 화면 ═══════ -->
<div id="view-scan" class="view fixed inset-0 overflow-hidden">
  <!-- 뷰파인더: 업로드/데모 사진 -->
  <div class="absolute inset-0 bg-black">
    <img id="photo" class="absolute inset-0 w-full h-full object-contain" alt="">
    <div class="absolute inset-0 scan-line opacity-20 pointer-events-none" id="scanline"></div>
  </div>
  <!-- AR 박스 레이어 (JS가 실좌표로 채움) -->
  <div id="ar" class="absolute inset-0 pointer-events-none"></div>

  <!-- 상단 상태 바 -->
  <header class="fixed top-0 left-0 w-full z-50 px-4 pt-4">
    <div class="bg-surface-container/70 backdrop-blur-md rounded-xl p-4 space-y-2 border border-outline-variant">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary cursor-pointer" onclick="show('home')" style="pointer-events:auto">arrow_back</span>
          <h1 class="font-bold" id="scan-title">사진을 선택하세요</h1>
        </div>
        <span class="text-primary font-mono-data text-sm" id="scan-count">-</span>
      </div>
      <div class="h-1 w-full bg-surface-variant/50 rounded-full overflow-hidden">
        <div class="h-full bg-primary transition-all duration-700" id="scan-bar" style="width:0%"></div>
      </div>
    </div>
  </header>

  <!-- 하단 액션 -->
  <div class="fixed bottom-0 left-0 w-full z-50 px-4 pb-5 space-y-3">
    <div class="flex justify-center" id="guide-chip" style="visibility:hidden">
      <div class="bg-primary-container text-on-primary-container px-5 py-2 rounded-full flex items-center gap-2 text-sm font-bold shadow-xl">
        <span class="material-symbols-outlined text-[18px]">directions_walk</span><span id="guide-text"></span>
      </div>
    </div>
    <div class="flex gap-2">
      <label class="flex-1 bg-surface-container/80 backdrop-blur border border-outline-variant rounded-xl py-3 text-center font-bold cursor-pointer">
        📷 사진 선택<input type="file" accept="image/*" id="file" class="hidden">
      </label>
      <button onclick="loadDemo(1)" class="flex-1 bg-surface-container/80 backdrop-blur border border-outline-variant rounded-xl py-3 font-bold">데모: 광각</button>
      <button onclick="loadDemo(2)" class="flex-1 bg-surface-container/80 backdrop-blur border border-outline-variant rounded-xl py-3 font-bold">데모: 17°각도</button>
    </div>
    <button onclick="showResult()" id="btn-result" class="w-full bg-primary text-on-primary rounded-xl py-3.5 font-bold text-lg" style="visibility:hidden">결과 보기</button>
  </div>
</div>

<!-- ═══════ 결과 화면 ═══════ -->
<div id="view-result" class="view max-w-md mx-auto px-4 py-6 space-y-6 pb-28">
  <header class="flex items-center gap-2">
    <span class="material-symbols-outlined text-primary cursor-pointer" onclick="show('scan')">arrow_back</span>
    <h1 class="text-xl font-bold" id="res-title">스캔 완료</h1>
  </header>

  <section class="text-center">
    <div class="relative inline-flex items-center justify-center">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="70" fill="none" stroke="#2d3449" stroke-width="10"/>
        <circle id="res-ring" cx="80" cy="80" r="70" fill="none" stroke="#4be277" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="440" transform="rotate(-90 80 80)"
                style="transition:stroke-dashoffset 1s ease"/>
      </svg>
      <div class="absolute text-center">
        <div class="text-3xl font-bold text-primary" id="res-pct">-</div>
        <div class="text-xs text-on-surface-variant" id="res-frac">-</div>
      </div>
    </div>
  </section>

  <section class="grid grid-cols-3 gap-3 text-center">
    <div class="bg-surface-container border border-primary/40 rounded-xl p-3">
      <div class="text-2xl font-bold text-primary" id="n-direct">-</div><div class="text-xs">직독 확인</div>
    </div>
    <div class="bg-surface-container border border-info/40 rounded-xl p-3">
      <div class="text-2xl font-bold" style="color:#7cb7ff" id="n-title">-</div><div class="text-xs">제목 복구</div>
    </div>
    <div class="bg-surface-container border border-outline-variant rounded-xl p-3">
      <div class="text-2xl font-bold text-on-surface-variant" id="n-gray">-</div><div class="text-xs">미확인</div>
    </div>
  </section>

  <section class="space-y-3">
    <h3 class="font-bold">매칭된 도서</h3>
    <div id="res-list" class="bg-surface-container border border-outline-variant rounded-xl divide-y divide-outline-variant max-h-72 overflow-y-auto"></div>
  </section>

  <div class="fixed bottom-0 left-0 w-full px-4 pb-5 pt-3 bg-gradient-to-t from-background to-transparent max-w-md mx-auto" style="left:50%;transform:translateX(-50%)">
    <button onclick="show('scan')" class="w-full bg-primary text-on-primary rounded-xl py-3.5 font-bold text-lg">다른 사진 스캔</button>
  </div>
</div>

<script>
const SZ = 1280, CONF = 0.25;
let sess = null, lastRows = null, lastDemo = 0;

function show(v) { document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active'); }

(async () => {
  try {
    const eps = navigator.gpu ? ['webgpu','wasm'] : ['wasm'];
    sess = await ort.InferenceSession.create('../call_label_yolo3/best.onnx', { executionProviders: eps });
    document.getElementById('home-backend').textContent = navigator.gpu ? 'WebGPU' : 'WASM';
  } catch(e) { document.getElementById('home-backend').textContent = '모델 로드 실패'; }
})();

// object-contain 이미지의 화면 배치 계산 (원본좌표 → 화면좌표)
function fitRect(img) {
  const vw = innerWidth, vh = innerHeight, W = img.naturalWidth, H = img.naturalHeight;
  const s = Math.min(vw / W, vh / H);
  return { s, ox: (vw - W * s) / 2, oy: (vh - H * s) / 2 };
}

function drawBoxes(img, rows) {
  const { s, ox, oy } = fitRect(img);
  const ar = document.getElementById('ar'); ar.innerHTML = '';
  let nd = 0, nt = 0, ng = 0;
  for (const r of rows) {
    const [x0, y0, x1, y1] = r.box;
    const d = document.createElement('div');
    d.style.cssText = `position:absolute;left:${x0*s+ox}px;top:${y0*s+oy}px;width:${(x1-x0)*s}px;height:${(y1-y0)*s}px;border-radius:2px;`;
    if (r.how === '청구기호') { d.style.border = '2px solid rgba(75,226,119,.85)'; d.style.background = 'rgba(75,226,119,.12)'; nd++; }
    else if (r.how === '제목복구') { d.style.border = '2px solid rgba(124,183,255,.85)'; d.style.background = 'rgba(124,183,255,.12)'; nt++; }
    else { d.style.border = '1px solid rgba(134,149,133,.6)'; d.style.background = 'rgba(45,52,73,.25)'; ng++; }
    if (r.call) { const t = document.createElement('div');
      t.textContent = r.call;
      t.style.cssText = 'position:absolute;top:-18px;left:0;font:600 10px Geist,monospace;color:#dae2fd;background:rgba(11,19,38,.8);padding:1px 4px;border-radius:3px;white-space:nowrap;';
      d.appendChild(t); }
    ar.appendChild(d);
  }
  const tot = rows.length, m = nd + nt;
  document.getElementById('scan-count').textContent = `${m}/${tot}권 매칭`;
  document.getElementById('scan-bar').style.width = (tot ? 100 * m / tot : 0) + '%';
  document.getElementById('btn-result').style.visibility = 'visible';
  return { nd, nt, ng };
}

async function detect(img) {
  const W = img.naturalWidth, H = img.naturalHeight, r = SZ / Math.max(W, H);
  const off = new OffscreenCanvas(SZ, SZ), ox = off.getContext('2d');
  ox.fillStyle = 'rgb(114,114,114)'; ox.fillRect(0, 0, SZ, SZ);
  ox.drawImage(img, 0, 0, W * r, H * r);
  const px = ox.getImageData(0, 0, SZ, SZ).data;
  const x = new Float32Array(3 * SZ * SZ);
  for (let i = 0, n = SZ * SZ; i < n; i++) { x[i] = px[i*4]/255; x[n+i] = px[i*4+1]/255; x[2*n+i] = px[i*4+2]/255; }
  const t0 = performance.now();
  const out = await sess.run({ images: new ort.Tensor('float32', x, [1, 3, SZ, SZ]) });
  const ms = performance.now() - t0;
  const d = out[Object.keys(out)[0]].data, rows = [];
  for (let i = 0; i < d.length; i += 6)
    if (d[i+4] >= CONF) rows.push({ box: [d[i]/r, d[i+1]/r, d[i+2]/r, d[i+3]/r], call: null, how: null });
  return { rows, ms };
}

async function loadDemo(n) {
  lastDemo = n;
  const img = document.getElementById('photo');
  img.src = `demo/demo${n}.jpg`;
  await img.decode();
  document.getElementById('scan-title').textContent = n === 1 ? '600번대 광각 (실측 데모)' : '700번대 17° 각도 (실측 데모)';
  document.getElementById('guide-text').textContent = '실시간 검출: 브라우저 ONNX · 인식·대조: 파이프라인 실측값';
  document.getElementById('guide-chip').style.visibility = 'visible';
  // 검출은 지금 이 브라우저에서 실행 (온디바이스 증명)
  const { ms } = await detect(img);
  // 인식·매칭 결과는 파이프라인 실측 JSON (PC 파이썬 산출물 — 동일 모델의 오프라인 실행)
  lastRows = await (await fetch(`demo/demo${n}.json`)).json();
  drawBoxes(img, lastRows);
  document.getElementById('scan-title').textContent += ` · 검출 ${ms.toFixed(0)}ms`;
}

document.getElementById('file').onchange = async ev => {
  const f = ev.target.files[0]; if (!f || !sess) return;
  lastDemo = 0;
  const img = document.getElementById('photo');
  img.src = URL.createObjectURL(f);
  await img.decode();
  document.getElementById('scan-title').textContent = '검출 중…';
  const { rows, ms } = await detect(img);
  lastRows = rows;
  drawBoxes(img, rows);
  document.getElementById('scan-title').textContent = `라벨 ${rows.length}개 검출 · ${ms.toFixed(0)}ms`;
  document.getElementById('guide-text').textContent = '인식·대조는 데모 사진에서 체험 가능 (모델 이식 진행 중)';
  document.getElementById('guide-chip').style.visibility = 'visible';
};

function showResult() {
  if (!lastRows) return;
  const nd = lastRows.filter(r => r.how === '청구기호').length;
  const nt = lastRows.filter(r => r.how === '제목복구').length;
  const ng = lastRows.length - nd - nt;
  const pct = lastRows.length ? Math.round(100 * (nd + nt) / lastRows.length) : 0;
  document.getElementById('n-direct').textContent = nd;
  document.getElementById('n-title').textContent = nt;
  document.getElementById('n-gray').textContent = ng;
  document.getElementById('res-pct').textContent = pct + '%';
  document.getElementById('res-frac').textContent = `${nd + nt}/${lastRows.length} 라벨 매칭`;
  document.getElementById('res-title').textContent = lastDemo ? (lastDemo === 1 ? '600번대 광각 스캔 완료' : '700번대 각도 스캔 완료') : '검출 완료 (매칭은 데모 사진에서)';
  const list = document.getElementById('res-list'); list.innerHTML = '';
  for (const r of lastRows.filter(r => r.call)) {
    const el = document.createElement('div');
    el.className = 'p-3 flex justify-between items-center text-sm';
    el.innerHTML = `<div><span class="font-mono-data font-semibold">${r.call}</span>
      <div class="text-xs text-on-surface-variant">${r.title || ''}</div></div>
      <span class="text-xs px-2 py-0.5 rounded ${r.how === '청구기호' ? 'bg-primary/20 text-primary' : 'text-[#7cb7ff] bg-[#7cb7ff]/15'}">${r.how}</span>`;
    list.appendChild(el);
  }
  show('result');
  setTimeout(() => document.getElementById('res-ring').style.strokeDashoffset = 440 - 4.4 * pct, 50);
}

addEventListener('resize', () => { const img = document.getElementById('photo');
  if (img.src && lastRows) drawBoxes(img, lastRows); });
</script>
</body>
</html>
